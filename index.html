<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 12px;
    padding: 40px 32px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  }

  .card h1 {
    font-size: 24px;
    color: #1f2937;
    margin-bottom: 6px;
    text-align: center;
  }

  .card p.subtitle {
    font-size: 14px;
    color: #6b7280;
    text-align: center;
    margin-bottom: 28px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 11px 14px;
    font-size: 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  .options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    font-size: 13px;
  }

  .options label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #4b5563;
    cursor: pointer;
  }

  .options a {
    color: #6366f1;
    text-decoration: none;
  }

  .options a:hover {
    text-decoration: underline;
  }

  button.submit {
    width: 100%;
    padding: 12px;
    background: #6366f1;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.submit:hover {
    background: #4f46e5;
  }

  .footer-text {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-top: 20px;
  }

  .footer-text a {
    color: #6366f1;
    text-decoration: none;
    font-weight: 600;
  }

  .footer-text a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue</p>

    <form action="#" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="options">
        <label>
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="submit">Sign In</button>
    </form>

    <p class="footer-text">Don't have an account? <a href="#">Sign up</a></p>
  </div>

</body>
</html>
